pre-push:
  jobs:
    - run: pnpm test:e2e
#
pre-commit:
  parallel: true
  jobs:
    - run: pnpm format --check {staged_files}
    - run: pnpm lint {staged_files}
    - run: pnpm check
    - run: pnpm test
