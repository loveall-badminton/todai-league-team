# https://lefthook.dev/configuration/
pre-push:
  jobs:
    - name: e2e
      run: pnpm test:e2e

pre-commit:
  parallel: true
  jobs:
    # フォーマット/リントはステージされたファイルだけを対象にする(全体スキャンは CI が担う)
    - name: prettier
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    - name: eslint
      glob: '*.{js,mjs,cjs,ts,svelte}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    # 型チェックとテストはプロジェクト全体が対象。コードに触れない
    # コミット(ドキュメント等)では glob 不一致でスキップされる
    - name: svelte-check
      glob: '*.{js,mjs,cjs,ts,svelte,json,jsonc}'
      run: pnpm check
    - name: unit-tests
      glob: '*.{js,mjs,cjs,ts,svelte,json,jsonc}'
      run: pnpm test
