name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (prettier + eslint)
        run: pnpm lint

      # Build first: the content-collections vite plugin generates
      # .content-collections/generated, which svelte-check needs to resolve
      # the 'content-collections' module.
      - name: Build
        run: pnpm build

      - name: Typecheck (svelte-check)
        run: pnpm check:ci

      - name: Unit tests
        run: pnpm test

      - name: Typecheck backup worker
        run: pnpm backup:check
